name: Release APK

# Runs when the `release` branch is created/updated. Builds the debug APK
# and attaches it to the public v1.0 release, so anyone can download it
# without a GitHub login.
on:
  push:
    branches: [release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Create GitHub Release v1.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "v1.0 — Bangla Live Subtitles" \
            --notes "Free build of Bangla Live Subtitles. Live Japanese speech from a video call, translated to Bangla as floating subtitles. No account, no ads, no paywall. See README for install steps and honest limits." \
            2>/dev/null || gh release upload v1.0 app/build/outputs/apk/debug/app-debug.apk --clobber
